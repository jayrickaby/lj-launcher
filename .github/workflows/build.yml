#
# The peculiarity of this workflow is that assumes vcpkg stored as a submodule of this
# repository.
# The workflow does the following:
# - Sets up vcpkg if needed, then run CMake with CMakePreset.json using a configuration
#   that leverages the vcpkg's toolchain file.
#   This will automatically run vcpkg to install dependencies described by the vcpkg.json
#   manifest file.
#   vcpkg's Binary Caching backed by GH Action cache is being used. It will be a no-op if 
#   the dependencies are restored from GH Action cache.
# - Finally builds the sources with Ninja.
#name: hosted-ninja_multi-vcpkg_submod-triplet-cacheoff
name: post-push actions
on:
#  push:
#    branches:
#      - main
  workflow_dispatch:

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Semantic Release
        uses: cycjimmy/semantic-release-action@v6
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
    outputs:
      new_release_published: ${{ steps.semantic.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic.outputs.new_release_version }}


  build:
    name: ${{ matrix.os }}-${{ github.workflow }}
#    needs: release
#    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
#        os: [ubuntu-latest, macos-latest, windows-latest]
        os: [ubuntu-latest, windows-latest]
        include:
          - os: windows-latest
            triplet: x64-windows
          - os: ubuntu-latest
            triplet: x64-linux
#          - os: macos-latest
#            triplet: x64-osx

    env:
      VCPKG_DEFAULT_TRIPLET: ${{ matrix.triplet }}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Qt [Windows]
        uses: jurplel/install-qt-action@v4.3.1
        if: runner.os == 'Windows'
        with:
          version: '6.11.2'
          arch: 'win64_msvc2022_64'
          aqtsource: 'git+https://github.com/miurahr/aqtinstall.git@master'

      - name: Install Qt [Linux]
        uses: jurplel/install-qt-action@v4.3.1
        if: runner.os == 'Linux'
        with:
          version: '6.11.2'

      - uses: lukka/get-cmake@latest
      - name: dir
        run: find $RUNNER_WORKSPACE
        shell: bash
      
      - name: Setup vcpkg [Linux]
        if: runner.os == 'Linux'
        uses: lukka/run-vcpkg@v11
        id: runvcpkgLinux
        with:
          vcpkgGitCommitId: 'ddd0023b0eee70986e42ed49d9d4afb8098f212e'
          vcpkgJsonGlob: '**/vcpkg.json'

      - name: Setup vcpkg [Windows]
        if: runner.os == 'Windows'
        uses: lukka/run-vcpkg@v11
        id: runvcpkgWindows
        with:
          vcpkgDirectory: 'C:/vcpkg'
          vcpkgGitCommitId: 'ddd0023b0eee70986e42ed49d9d4afb8098f212e'
          vcpkgJsonGlob: '**/vcpkg.json'
          
      - name: List $RUNNER_WORKSPACE before build
        run: find $RUNNER_WORKSPACE
        shell: bash
      - name: Prints output of run-vcpkg's action.
        if: runner.os == 'Windows'
        run: echo "root='${{ steps.runvcpkgWindows.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}', triplet='${{ steps.runvcpkgWindows.outputs.RUNVCPKG_VCPKG_DEFAULT_TRIPLET_OUT }}' "
          
      - name: List $RUNNER_WORKSPACE before build
        run: find $RUNNER_WORKSPACE
        shell: bash
      - name: Prints output of run-vcpkg's action.
        if: runner.os == 'Linux'
        run: echo "root='${{ steps.runvcpkgLinux.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}', triplet='${{ steps.runvcpkgLinux.outputs.RUNVCPKG_VCPKG_DEFAULT_TRIPLET_OUT }}' "
        
      - name: Run CMake+vcpkg+NinjaMulti-Config (Release configuration)
        uses: lukka/run-cmake@v10
        id: runcmake
        with:
          cmakeListsTxtPath: '${{ github.workspace }}/CMakeLists.txt'
          configurePreset: 'ninja-multi-vcpkg'
          buildPreset: 'ninja-vcpkg-release'

      - name: List $RUNNER_WORKSPACE after build
        run: find $RUNNER_WORKSPACE
        shell: bash

      - name: Upload Binaries
        uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.os }}
          path: 'build/bin/Release/*'

  upload-assets:
    name: Upload Assets
    needs: [release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download Win Binary
        uses: actions/download-artifact@v7
        with:
          name: binary-windows-latest
          path: dist/

      - name: Download Linux Binary
        uses: actions/download-artifact@v7
        with:
          name: binary-linux-latest
          path: dist/

      - name: Publish
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.release.outputs.new_release_version }}
          working_directory: dist
          files: |
            *
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
