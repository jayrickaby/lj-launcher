name: create release

on: [ push ]

jobs:
  job:
    name: create release
    runs-on: ubuntu-latest
    steps:
        - name: Checkout
          uses: actions/checkout@v7
          with:
            persist-credentials: false

        - name: Semantic Release
          uses: cycjimmy/semantic-release-action@v6
          env:
            GITHUB_TOKEN: ${{ secrets.GH_PAT }}
